plugins {
  id 'com.android.application'
}

android {
  namespace 'com.nkuo.carid'
  compileSdk 34

  // 版號跟著 GitHub Actions 的編號走，跟 Release 的 apk-N 對得起來，
  // App 裡面才有辦法比對「線上是不是有比我新的版本」
  def build = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

  // 固定的 release 簽章金鑰。金鑰檔和密碼都不在 repo 裡：
  // android/key.properties（storeFile / storePassword / keyAlias / keyPassword）
  // 在 GitHub Actions 上由 Secrets 產生，自己電腦上就手動放一份。
  def keyProps = new Properties()
  def keyPropsFile = rootProject.file("key.properties")
  if (keyPropsFile.exists()) {
    keyPropsFile.withInputStream { keyProps.load(it) }
  }

  defaultConfig {
    applicationId "com.nkuo.carid"
    minSdk 24
    targetSdk 34
    versionCode build
    versionName "1.0." + build
  }

  signingConfigs {
    release {
      if (keyPropsFile.exists()) {
        storeFile file(keyProps["storeFile"])
        storePassword keyProps["storePassword"]
        keyAlias keyProps["keyAlias"]
        keyPassword keyProps["keyPassword"]
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.core:core:1.13.1'
}

// 沒有 key.properties 就不准編 release，免得又編出 debug 或沒簽章的 APK
gradle.taskGraph.whenReady { graph ->
  if (graph.allTasks.any { it.name.contains("Release") } && !rootProject.file("key.properties").exists()) {
    throw new GradleException("找不到 android/key.properties，不能編 release APK（金鑰設定見 README）")
  }
}
