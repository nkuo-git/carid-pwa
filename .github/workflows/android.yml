name: 編 APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 固定的 release 金鑰（apk-4 起一直是同一把，別名 carid）。
      # 金鑰檔放在 Secret CARID_KEYSTORE_B64（base64），密碼在 CARID_KEY_PASS，
      # 這裡寫出 android/app/carid-release.jks 和 android/key.properties，兩個都不進 repo。
      # 缺任何一個就直接失敗，絕不自己產新金鑰、也不退回 debug 簽章。
      - name: 準備簽章金鑰
        env:
          CARID_KEYSTORE_B64: ${{ secrets.CARID_KEYSTORE_B64 }}
          CARID_KEY_PASS: ${{ secrets.CARID_KEY_PASS }}
        run: |
          if [ -z "$CARID_KEYSTORE_B64" ] || [ -z "$CARID_KEY_PASS" ]; then
            echo "::error::缺少 Secret CARID_KEYSTORE_B64 或 CARID_KEY_PASS，不能簽 release APK"
            exit 1
          fi
          echo "$CARID_KEYSTORE_B64" | tr -d " \r\n" | base64 -d > android/app/carid-release.jks
          {
            echo "storeFile=carid-release.jks"
            echo "storePassword=$CARID_KEY_PASS"
            echo "keyAlias=carid"
            echo "keyPassword=$CARID_KEY_PASS"
          } > android/key.properties

      - name: 編譯
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # 每次都印出簽章指紋，跟 apk-4 起的那一把比對，不一樣就不發
      - name: 檢查簽章指紋
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          case "$APK" in *unsigned*) echo "::error::APK 沒有簽章"; exit 1 ;; esac
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi "SHA-256 digest: ecddf4e8159dcc6a250853a373a600edad2110b3e84ac7df1c106ff4c974dffb" certs.txt \
            || { echo "::error::簽章指紋跟固定金鑰不一樣，裝了會蓋不過舊版"; exit 1; }

      - name: 收掉金鑰
        if: always()
        run: rm -f android/app/carid-release.jks android/key.properties

      - name: 改個看得懂的檔名
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/carid-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: carid-apk
          path: out/*.apk

      - name: 發成 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" out/*.apk \
            --title "大便龍的萬能軟體 APK #${{ github.run_number }}" \
            --notes "用手機開這一頁，點下面的 .apk 就能安裝。第一次安裝要允許「安裝不明來源的應用程式」。"
