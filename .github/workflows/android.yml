name: 編 APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 編譯
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: 改個看得懂的檔名
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/carid-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: carid-apk
          path: out/*.apk

      - name: 發成 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" out/*.apk \
            --title "大便龍的辨車軟體 APK #${{ github.run_number }}" \
            --notes "用手機開這一頁，點下面的 .apk 就能安裝。第一次安裝要允許「安裝不明來源的應用程式」。"
