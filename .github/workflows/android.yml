name: 編 APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 第一次跑的時候用 Secret 裡的密碼產一把固定的簽章金鑰，並存回 repo。
      # 之後每次都用同一把簽，新版 APK 才能直接蓋過舊版安裝，不用先移除。
      - name: 準備簽章金鑰
        env:
          CARID_KEY_PASS: ${{ secrets.CARID_KEY_PASS }}
        run: |
          if [ -z "$CARID_KEY_PASS" ]; then
            echo "::warning::還沒設定 CARID_KEY_PASS，這次會用臨時的 debug 簽章，裝之前要先移除舊版"
            exit 0
          fi
          if [ -f android/keystore/carid.jks ]; then
            echo "已經有固定的簽章金鑰了"
            exit 0
          fi
          mkdir -p android/keystore
          keytool -genkeypair -v \
            -keystore android/keystore/carid.jks \
            -storepass "$CARID_KEY_PASS" -keypass "$CARID_KEY_PASS" \
            -alias carid -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=carid, OU=personal, O=carid, L=Taipei, S=Taipei, C=TW"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/keystore/carid.jks
          git commit -m "建立固定的簽章金鑰，之後的 APK 都用這一把簽"
          git push origin HEAD:main

      - name: 編譯
        working-directory: android
        env:
          CARID_KEY_PASS: ${{ secrets.CARID_KEY_PASS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: 改個看得懂的檔名
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/carid-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: carid-apk
          path: out/*.apk

      - name: 發成 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" out/*.apk \
            --title "大便龍的萬能軟體 APK #${{ github.run_number }}" \
            --notes "用手機開這一頁，點下面的 .apk 就能安裝。第一次安裝要允許「安裝不明來源的應用程式」。"
